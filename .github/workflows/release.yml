name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build and upload the app without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve version
        id: meta
        run: |
          version=$(cargo pkgid -p jalak-desktop | sed 's/.*[#@]//')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "error: tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: cargo test --workspace

      - name: Package universal app
        env:
          JALAK_UNIVERSAL: "1"
        run: ./scripts/package-macos.sh

      - name: Archive
        id: archive
        run: |
          zip="Jalak-v${{ steps.meta.outputs.version }}-macos-universal.zip"
          ditto -c -k --keepParent target/Jalak.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Upload build (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.archive.outputs.zip }}
          path: ${{ steps.archive.outputs.zip }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: ${{ steps.archive.outputs.zip }}
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ZIP"
          # Latest published release, read before this one exists.
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          {
            awk -v h="## $VERSION " 'index($0, h) == 1 {f=1; next} f && /^##/{exit} f' CHANGELOG.md
            printf '**Download Jalak:** [Mac (Apple silicon and Intel)](%s)\n\n' "$url"
            cat <<'EOF'
          Unzip, move `Jalak.app` to `/Applications`, then clear the download
          quarantine (the app is not notarized):

          ```bash
          xattr -dr com.apple.quarantine /Applications/Jalak.app
          ```

          EOF
            awk -v h="## $VERSION " 'index($0, h) == 1 {f=1; next} /^## /{f=0} f && /^### /{p=1} f && p' CHANGELOG.md
            if [[ -n "$prev" ]]; then
              printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Jalak $GITHUB_REF_NAME" --notes-file notes.md
